name: pakshya_mobile
description: "PAKSHYA — Legal Metrology AI Inspection Mobile App (Department of Consumer Affairs, Govt. of India)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP & Network
  http: ^1.6.0
  uuid: ^4.3.3
  http_parser: ^4.0.2
  pdf: ^3.10.7
  printing: ^5.11.1
  shared_preferences: ^2.2.3

  # Camera & Image Handling
  camera: ^0.10.5+9
  image_picker: ^1.1.0
  cached_network_image: ^3.3.1

  # State Management & UI Utilities
  provider: ^6.1.2
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  intl: ^0.19.0
  path_provider: ^2.1.2
  open_file: ^3.3.2
  flutter_spinkit: ^5.2.0
  flutter_svg: ^2.0.10+1
  appwrite: ^17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
